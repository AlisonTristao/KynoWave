[env:esp32s3]
platform                = espressif32
board                   = esp32-s3-devkitc-1
framework               = arduino
monitor_speed           = 115200
board_build.f_cpu       = 240000000L
board_build.flash_size  = 16MB

; external libraries
lib_deps = 
    https://github.com/AlisonTristao/TinyShell
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    knolleary/PubSubClient@^2.8

; extra library directories
lib_extra_dirs = utils
build_flags = 
    -I include
    -I utils
    -I lib
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBAUDRATE=115200
    ; Wifi, mqtt e OTA settings
    -DWIFI_SSID=\"ole telecom.129246\"
    -DWIFI_PASSWORD=\"474726264h\"
    -DMQTT_SERVER=\"192.168.0.100\"
    -DMQTT_PORT=1883
    -DMQTT_TOPIC=\"kynowave/logs\"
    -DMQTT_CMD_TOPIC=\"kynowave/cmd\"
    -DOTA_HOSTNAME=\"KynoWave\"
    -DOTA_PASSWORD=\"657585\"

build_unflags = 
    -std=gnu++11

; OTA upload configuration
upload_protocol = espota
upload_port = 192.168.0.113 ; IP (KynoWave)
upload_flags =
    --auth=657585