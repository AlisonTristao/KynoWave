[env:esp32s3]
platform                = espressif32@6.5.0
board                   = esp32-s3-devkitc-1
framework               = arduino
monitor_speed           = 115200
board_build.f_cpu       = 240000000L
board_build.flash_size  = 16MB

; external libraries
lib_deps = 
    https://github.com/AlisonTristao/TinyShell
    bodmer/TFT_eSPI @ ^2.5.43
    knolleary/PubSubClient@^2.8
    lvgl/lvgl@^8.3.11

; extra library directories
lib_extra_dirs = utils
build_flags = 
    -I include
    -I utils
    -I lib
    -std=gnu++2a
    -DUSER_SETUP_LOADED=1
    -DVERBOSE_OFF=1
    -include include/Settings.h
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBAUDRATE=115200
    ; Wifi, mqtt e OTA settings
    -DWIFI_SSID='"ole telecom.129246"'
    -DWIFI_PASSWORD='"474726264h"'
    -DMQTT_SERVER='"192.168.0.100"'
    -DMQTT_PORT=1883
    -DMQTT_TOPIC='"kynowave/logs"'
    -DMQTT_CMD_TOPIC='"kynowave/cmd"'
    -DOTA_HOSTNAME=\"KynoWave\"
    -DOTA_PASSWORD=\"657585\"
    -DNTP_SERVER_1='"pool.ntp.org"'
    -DNTP_SERVER_2='"time.nist.gov"'
    -DNTP_SERVER_3='"time.google.com"'
    -DGMT_OFFSET_SEC=-10800
    -DDAYLIGHT_OFFSET_SEC=0

build_unflags = 
    -std=gnu++11

; ota settings
upload_port = KynoWave
upload_protocol = espota
; senha 
upload_flags = 
    --auth=657585