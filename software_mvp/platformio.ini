[env:esp32s3]
platform                = espressif32
board                   = esp32-s3-devkitc-1
framework               = arduino
monitor_speed           = 115200
upload_speed            = 921600
board_build.f_cpu       = 240000000L
board_build.flash_size  = 16MB

; external libraries
lib_deps = 
    https://github.com/AlisonTristao/TinyShell

; extra library directories
lib_extra_dirs = utils
build_flags = 
    -I include
    -I utils
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBAUDRATE=115200

build_unflags = 
    -std=gnu++11