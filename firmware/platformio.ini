; KynoWave firmware (ESP-IDF) -- the BTPDevice test bench.
;
;   pio run -t upload        flash
;   pio run -t uploadfs      data/ -> LittleFS (wifi.txt, bally.key)
;   pio device monitor       console on UART0 (the tx/rx pins); the native
;                            USB port is BTPDevice's link to TraceView
[platformio]
src_dir = main

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
